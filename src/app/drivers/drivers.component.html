<div class="page-header">
  <h2 class="page-title">Chauffører</h2>
</div>

<div class="toolbar-row no-print">
  <button matButton="filled" type="button" (click)="create()">Opret chauffør</button>
</div>

<div class="table-scroll">
  <table class="data-table card-on-mobile">
    <thead>
    <tr>
      <th class="col-w-25">Kaldenavn</th>
      <th>Fulde navn</th>
      <th class="col-w-25">Fødselsdag</th>
      <th>Login</th>
      <th class="col-w-15">Admin</th>
      <th class="col-w-5 no-print"></th>
    </tr>
    </thead>
    <tbody>
    @if (users$ | async; as users) {
      @for (driver of (drivers | async) ?? []; track driver.$key) {
        <tr class="hoverable">
          <th>{{driver.displayName}}</th>
          <td data-label="Fulde navn">{{driver.name}}</td>
          <td data-label="Fødselsdag">{{driver.birthday?.toDate()|date}}</td>
          <td data-label="Login">{{driver.email}}</td>
          <td data-label="Admin">
            @if (driver.uid) {
              <mat-checkbox [checked]="isDriverAdmin(driver, users)"
                            (change)="setDriverAdmin(driver, $event)"
                            [attr.aria-label]="'Administrator: ' + driver.displayName">
              </mat-checkbox>
            }
          </td>
          <td class="no-print cell-actions">
            <div class="row-actions">
              @if (!driver.uid) {
                <button matIconButton type="button" aria-label="Opret login" matTooltip="Opret login" (click)="createLogin(driver)">
                  <mat-icon>key</mat-icon>
                </button>
              }
              <button matIconButton type="button" aria-label="Rediger" matTooltip="Rediger" (click)="edit(driver)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton type="button" aria-label="Slet" matTooltip="Slet" (click)="removeDriver(driver)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </tr>
      }
    }
    </tbody>
  </table>
</div>
