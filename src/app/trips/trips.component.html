<ng-template #empty><em class="d-print-none">Ingen ture.</em></ng-template>
<ng-container *ngIf="drivers$ | async as drivers">
<ng-container *ngIf="vehicles$ | async as vehicles">
<table class="table table-hover table-sm" *ngIf="trips && trips.length > 0; else empty">
  <thead>
  <tr>
    <th class="w-6">Start</th>
    <th class="w-6">Slut</th>
    <th>Tur</th>
    <th class="w-15">Chauffører</th>
    <th class="w-15">Køretøjer</th>
    <th class="w-5 d-print-none" *ngIf="!readonly"></th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let trip of trips; trackBy: trackByFn">
    <th>
      <span ngbTooltip="{{trip.start.toDate() | date: 'short'}}" container="'body'">
      {{trip.start.toDate() | date: 'HH:mm' }}
      </span>
    </th>
    <td class="text-muted">
      <span ngbTooltip="{{trip.end?.toDate() | date: 'short'}}" container="'body'">
        {{trip.end?.toDate() | date:'HH:mm' }}
      </span>
    </td>
    <td>
      {{trip.name}}
      <small class="text-muted d-print-inline newline"><br>{{trip.description}}</small>
    </td>
    <td [class.table-warning]="!trip.drivers || trip.drivers.length < trip.vehicles?.length">
      <span *ngFor="let key of trip.drivers; let isLast=last">
      {{ getDriver(drivers, key)?.displayName }}{{isLast ? '' : ', '}}
      </span>
    </td>
    <td [class.table-warning]="!trip.vehicles || trip.drivers?.length > trip.vehicles.length">
      <span *ngFor="let key of trip.vehicles; let isLast=last">
      {{ getVehicle(vehicles, key)?.displayName }}{{isLast ? '' : ', '}}
      </span>
    </td>
    <td class="d-print-none" *ngIf="!readonly">
      <div class="float-end icons">
        <a class="pointer"
           (click)="edit.emit(trip)">
          <i class="fa fa-pencil" ngbTooltip="Rediger"></i>
        </a>
        <a mwlConfirmationPopover
           class="pointer"
           [popoverMessage]="'Er du sikker på, at du vil slette turen<br>\'' + trip.name + '\'?'"
           [confirmButtonType]="'danger'"
           [confirmText]="'Slet'"
           [cancelText]="'Annuller'"
           placement="left"
           (confirm)="remove.emit(trip)">
          <i class="fa fa-trash" ngbTooltip="Slet"></i>
        </a>
      </div>
    </td>
  </tr>
  </tbody>
</table>
</ng-container>
</ng-container>
