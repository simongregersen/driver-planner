<main class="page-main">
  @if (userService.driverProfile$ | async; as driver) {
    <div class="day-grid">
      <h3 class="section-heading gc-tr-heading">Tidsregistrering</h3>
      <app-clock-punch class="gc-punch no-print" [driverKey]="driver.$key"></app-clock-punch>
      <app-time-reporting class="gc-tr-table" [driverKey]="driver.$key" [from]="recordsWindowStart" [limit]="3"></app-time-reporting>

      <h3 class="section-heading gc-mt-heading">
        Mine ture
        <small>{{ selectedDate.toDate() | date:'EEEE, d MMMM y' }}</small>
      </h3>

      <div class="gc-date-nav sidebar-stack no-print">
        <mat-calendar class="inline-calendar"
                      [selected]="selectedDate"
                      (selectedChange)="onDateSelected($event)"
                      [minDate]="minDate"
                      [dateFilter]="dateFilter()">
        </mat-calendar>
        <mat-form-field class="compact-date-field" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Dato</mat-label>
          <input matInput
                 readonly
                 [matDatepicker]="d"
                 [min]="minDate"
                 [matDatepickerFilter]="dateFilter()"
                 [ngModel]="selectedDate"
                 (ngModelChange)="onDateSelected($event)"
                 (click)="d.open()">
          <mat-datepicker-toggle matIconSuffix [for]="d"></mat-datepicker-toggle>
          <mat-datepicker #d></mat-datepicker>
        </mat-form-field>
        <div class="button-row" role="group" aria-label="Dato-navigation">
          <button matButton="outlined" type="button" [disabled]="!hasPreviousPublicDate()" (click)="previousDay()">Forrige</button>
          <button matButton="outlined" type="button" (click)="goToToday()">I dag</button>
          <button matButton="outlined" type="button" [disabled]="!hasNextPublicDate()" (click)="nextDay()">Næste</button>
        </div>
      </div>

      <div class="gc-trips">
        @if (dayPublic$ | async) {
          @if (trips$ | async; as trips) {
            <app-trips [trips]="filterMyTrips(trips, driver)"
                       [readonly]="true"
                       [highlightModified]="true"
                       [hideSingleDriver]="true"
                       [showFinishToggle]="true"></app-trips>
          }
        } @else {
          <p class="muted">Denne dag er endnu ikke gjort synlig af en administrator.</p>
        }
      </div>
    </div>
  }
</main>
