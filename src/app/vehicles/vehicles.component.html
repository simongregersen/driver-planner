<div class="page-header">
  <h2 class="page-title">Køretøjer</h2>
</div>

<div class="toolbar-row no-print">
  <button matButton="filled" type="button" (click)="create()">Opret køretøj</button>
</div>

<div class="table-scroll">
  <table class="data-table card-on-mobile">
    <thead>
    <tr>
      <th>Kaldenavn</th>
      <th class="col-w-25">Mærke</th>
      <th class="col-w-25">Reg. nr.</th>
      <th class="col-w-25">Sidst synet</th>
      <th class="col-w-5 no-print"></th>
    </tr>
    </thead>
    <tbody>
    @for (vehicle of (vehicles | async) ?? []; track vehicle.$key) {
      <tr class="hoverable">
        <th>{{vehicle.displayName}}</th>
        <td data-label="Mærke">{{vehicle.brand}}</td>
        <td data-label="Reg. nr.">{{vehicle.regNo}}</td>
        <td data-label="Sidst synet">{{vehicle.latestInspection | date }}</td>
        <td class="no-print cell-actions">
          <div class="row-actions">
            <button matIconButton type="button" matTooltip="Rediger" (click)="edit(vehicle)">
              <mat-icon>edit</mat-icon>
            </button>
            <button matIconButton type="button" matTooltip="Slet" (click)="removeVehicle(vehicle)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </tr>
    }
    </tbody>
  </table>
</div>
