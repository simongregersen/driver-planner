@if (data.title) {
  <h2 mat-dialog-title>{{ data.title }}</h2>
}

<mat-dialog-content>
  <p class="confirm-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton type="button" (click)="dialogRef.close(false)">{{ data.cancelLabel || 'Annuller' }}</button>
  <button matButton="filled" type="button" [class.confirm-danger]="data.danger"
          (click)="dialogRef.close(true)">{{ data.confirmLabel || 'OK' }}</button>
</mat-dialog-actions>
