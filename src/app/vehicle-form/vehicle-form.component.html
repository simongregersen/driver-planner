<h2 mat-dialog-title>{{ mode === 'edit' ? 'Rediger' : 'Opret køretøj' }}</h2>

<mat-dialog-content>
  <form id="vehicleForm" class="form-stack" [formGroup]="vehicleForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <mat-label>Kaldenavn</mat-label>
      <input matInput type="text" formControlName="displayName">
      @if (vehicleForm.controls['displayName'].hasError('required')) {
        <mat-error>Et kaldenavn er påkrævet.</mat-error>
      }
    </mat-form-field>

    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <mat-label>Mærke</mat-label>
      <input matInput type="text" formControlName="brand">
    </mat-form-field>

    <mat-form-field class="full-width" subscriptSizing="dynamic">
      <mat-label>Reg. nr.</mat-label>
      <input matInput type="text" formControlName="regNo">
    </mat-form-field>

    <app-date-field class="date-field" label="Sidst synet"
                     [value]="vehicleForm.controls['latestInspection'].value" [minDate]="minDate"
                     (valueChange)="setLatestInspection($event)"></app-date-field>

    <mat-checkbox formControlName="isRutebus">Rutebus</mat-checkbox>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (mode === 'edit') {
    <button matButton type="button" class="confirm-danger" (click)="deleteVehicle()">Slet</button>
  }
  <button matButton type="button" mat-dialog-close>Annuller</button>
  <button matButton="filled" type="submit" form="vehicleForm" [disabled]="!vehicleForm.valid">{{ mode === 'edit' ? 'Gem' : 'Opret' }}</button>
</mat-dialog-actions>
