<div class="page-header no-print">
  <h2 class="page-title">Skabeloner</h2>
</div>
<div class="page-layout">
  <aside class="page-aside no-print">
    <div class="sidebar-stack">
      <div>
        <h5 class="section-title">Oversigt</h5>
        <mat-list class="template-list">
          @for (template of (templates$ | async) ?? []; track template.$key) {
            <mat-list-item [class.active-item]="selectedTemplate?.$key === template?.$key">
              <button matListItemTitle type="button" class="template-name"
                      (click)="selectedTemplate = template">{{template.name}}</button>
              <button matIconButton matListItemMeta type="button" aria-label="Slet" matTooltip="Slet"
                      (click)="removeTemplate(template)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-list-item>
          }
        </mat-list>
      </div>
      <form [formGroup]="templateForm" (ngSubmit)="createTemplate()">
        <mat-form-field class="full-width" subscriptSizing="dynamic">
          <mat-label>Opret skabelon</mat-label>
          <input matInput placeholder="Navn" formControlName="name">
          <button matIconButton matIconSuffix type="submit" aria-label="Opret" matTooltip="Opret">
            <mat-icon>add</mat-icon>
          </button>
        </mat-form-field>
      </form>
    </div>
  </aside>
  <main class="page-main">
    <!-- Deliberately NOT readonly. That input freezes the whole row, including the row-click that
         is the only way to open a trip for editing (see TripsComponent.onRowClick) — templates
         have to stay editable. The chips' remove "X" is wired up properly instead, so it does
         what it advertises rather than being a dead control. -->
    <app-trips [trips]="(trips$ | async) ?? []"
               [showLabels]="true"
               [showWarnings]="false"
               (edit)="edit($event)"
               (removeDriver)="removeDriverFromTrip($event)"
               (removeVehicle)="removeVehicleFromTrip($event)">
    </app-trips>
    <div class="toolbar-row no-print">
      <button matButton="filled" type="button" (click)="create()">Opret tur</button>
    </div>
  </main>
</div>
